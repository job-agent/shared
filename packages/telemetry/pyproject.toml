[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetry"
version = "0.1.0"
description = "OpenTelemetry telemetry module for distributed tracing and metrics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-pika>=0.49b0",
    "opentelemetry-instrumentation-requests>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry"]

[tool.pytest.ini_options]
testpaths = ["smoke_tests"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]

[tool.ruff]
line-length = 100
target-version = "py39"
