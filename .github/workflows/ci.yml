name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Install all packages to scan their dependencies
          pip install -e "packages/job-scrapper-contracts"
          pip install -e "packages/telemetry"
          pip install -e "packages/scrapper-messaging"

      - name: Run security audit
        run: ./scripts/security_audit.sh

  test-job-scrapper-contracts:
    name: Test - job-scrapper-contracts
    runs-on: ubuntu-latest
    needs: [lint, security-audit]
    defaults:
      run:
        working-directory: packages/job-scrapper-contracts
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest smoke_tests/ -v

  test-scrapper-messaging:
    name: Test - scrapper-messaging
    runs-on: ubuntu-latest
    needs: [lint, security-audit]
    defaults:
      run:
        working-directory: packages/scrapper-messaging
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "../job-scrapper-contracts[dev]"
          pip install -e "../telemetry[dev]"
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest smoke_tests/ -v

  test-telemetry:
    name: Test - telemetry
    runs-on: ubuntu-latest
    needs: [lint, security-audit]
    defaults:
      run:
        working-directory: packages/telemetry
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest smoke_tests/ -v

  quality-tests:
    name: Quality Tests (Type Checking)
    runs-on: ubuntu-latest
    needs: [test-job-scrapper-contracts, test-scrapper-messaging, test-telemetry]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install all packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/job-scrapper-contracts[dev]"
          pip install -e "packages/telemetry[dev]"
          pip install -e "packages/scrapper-messaging[dev]"

      - name: Run quality tests
        run: pytest -m quality -v quality_tests/
