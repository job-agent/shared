name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check-job-scrapper-contracts:
    name: Type Check - job-scrapper-contracts
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: job-scrapper-contracts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/job_scrapper_contracts

  type-check-scrapper-messaging:
    name: Type Check - scrapper-messaging
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: scrapper-messaging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "../job-scrapper-contracts[dev]"
          pip install -e "../telemetry[dev]"
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/scrapper_messaging --ignore-missing-imports

  test-job-scrapper-contracts:
    name: Test - job-scrapper-contracts
    runs-on: ubuntu-latest
    needs: type-check-job-scrapper-contracts
    defaults:
      run:
        working-directory: job-scrapper-contracts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest smoke_tests/ -v

  test-scrapper-messaging:
    name: Test - scrapper-messaging
    runs-on: ubuntu-latest
    needs: type-check-scrapper-messaging
    defaults:
      run:
        working-directory: scrapper-messaging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "../job-scrapper-contracts[dev]"
          pip install -e "../telemetry[dev]"
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest src/ -v

      - name: Run smoke tests
        run: pytest smoke_tests/ -v

  test-telemetry:
    name: Test - telemetry
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: telemetry
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest src/ -v
