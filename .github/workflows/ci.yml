name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install all packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/job-scrapper-contracts[dev]"
          pip install -e "packages/telemetry[dev]"
          pip install -e "packages/scrapper-messaging[dev]"

      - name: Run mypy on all packages
        run: |
          mypy --config-file packages/job-scrapper-contracts/pyproject.toml packages/job-scrapper-contracts/src/job_scrapper_contracts
          mypy --config-file packages/telemetry/pyproject.toml packages/telemetry/src/telemetry
          mypy --config-file packages/scrapper-messaging/pyproject.toml packages/scrapper-messaging/src/scrapper_messaging --ignore-missing-imports

  test-job-scrapper-contracts:
    name: Test - job-scrapper-contracts
    runs-on: ubuntu-latest
    needs: type-check
    defaults:
      run:
        working-directory: packages/job-scrapper-contracts
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest smoke_tests/ -v

  test-scrapper-messaging:
    name: Test - scrapper-messaging
    runs-on: ubuntu-latest
    needs: type-check
    defaults:
      run:
        working-directory: packages/scrapper-messaging
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "../job-scrapper-contracts[dev]"
          pip install -e "../telemetry[dev]"
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest smoke_tests/ -v

  test-telemetry:
    name: Test - telemetry
    runs-on: ubuntu-latest
    needs: type-check
    defaults:
      run:
        working-directory: packages/telemetry
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest smoke_tests/ -v

  quality-tests:
    name: Quality Tests (Type Checking)
    runs-on: ubuntu-latest
    needs: [test-job-scrapper-contracts, test-scrapper-messaging, test-telemetry]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install all packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/job-scrapper-contracts[dev]"
          pip install -e "packages/telemetry[dev]"
          pip install -e "packages/scrapper-messaging[dev]"

      - name: Run quality tests
        run: pytest -m quality -v quality_tests/
